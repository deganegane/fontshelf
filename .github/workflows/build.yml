name: Build FontShelf

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (single-file .exe)
        run: >
          dotnet publish src/FontShelf/FontShelf.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=1.0.${{ github.run_number }}
          -o out

      - name: Test dodavanja hrvatskih znakova
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          New-Item -ItemType Directory -Force test/out | Out-Null
          $fonts = @("ofl/abeezee/ABeeZee-Regular.ttf","ofl/abeezee/ABeeZee-Italic.ttf","ofl/abel/Abel-Regular.ttf","apache/aclonica/Aclonica-Regular.ttf")
          foreach ($f in $fonts) { Invoke-WebRequest "https://raw.githubusercontent.com/google/fonts/main/$f" -OutFile ("test/" + (Split-Path $f -Leaf)) }
          python -m pip install -q fonttools opentype-sanitizer pillow
          python tools/make_nocaron.py test/ABeeZee-Regular.ttf test/NoCaron-Regular.ttf
          New-Item -ItemType Directory -Force test/orig | Out-Null
          $otfs = @("source-sans/release/OTF/SourceSans3-Regular.otf","source-serif/release/OTF/SourceSerif4-It.otf","source-code-pro/release/OTF/SourceCodePro-Bold.otf","source-han-sans/release/SubsetOTF/KR/SourceHanSansKR-Regular.otf")
          foreach ($f in $otfs) { Invoke-WebRequest "https://raw.githubusercontent.com/adobe-fonts/$f" -OutFile ("test/orig/" + (Split-Path $f -Leaf)) }
          python tools/strip_hr.py test/orig/SourceSans3-Regular.otf test/SourceSans3-Regular.otf noeth
          python tools/strip_hr.py test/orig/SourceSerif4-It.otf test/SourceSerif4-It.otf nocaron noeth
          python tools/strip_hr.py test/orig/SourceCodePro-Bold.otf test/SourceCodePro-Bold.otf
          python tools/strip_hr.py test/orig/SourceHanSansKR-Regular.otf test/SourceHanSansKR-Regular.otf noeth
          $outDir = (Resolve-Path test/out).Path
          foreach ($ttf in Get-ChildItem test/* -Include *.ttf,*.otf -File) {
            $dst = Join-Path $outDir ($ttf.BaseName + "-HR" + $ttf.Extension)
            $p = Start-Process -FilePath out/FontShelf.exe -ArgumentList @("--patch-hr", "`"$($ttf.FullName)`"", "`"$dst`"") -Wait -PassThru
            if ($p.ExitCode -ne 0) { Write-Host "Greška za $($ttf.Name):"; Get-Content "$dst.err"; exit 1 }
            Get-Content "$dst.log"
          }
          python tools/check_patched.py test/out
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test prozora za hrvatske znakove (WPF)
        shell: pwsh
        run: |
          $fail = $false
          $srcDir = Join-Path (Resolve-Path test).Path "ui-src"
          New-Item -ItemType Directory -Force $srcDir | Out-Null
          foreach ($name in @("SourceSans3-Regular.otf","SourceSerif4-It.otf","SourceCodePro-Bold.otf","ABeeZee-Regular.ttf","ABeeZee-Italic.ttf","Abel-Regular.ttf","Aclonica-Regular.ttf")) { Copy-Item "test/$name" $srcDir }
          $dir = Join-Path (Resolve-Path test).Path "ui"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $p = Start-Process -FilePath out/FontShelf.exe -ArgumentList @("--ui-test", "`"$srcDir`"", "`"$dir`"") -PassThru
          if (-not $p.WaitForExit(240000)) { Write-Host "ISTEKLO VRIJEME"; $p.Kill(); $fail = $true }
          Write-Host "===== izlaz $($p.ExitCode)"
          if (Test-Path "$dir/trace.log") { Get-Content "$dir/trace.log" | Where-Object { $_ -notmatch "pregled|patch |spremljeno C|spremljeno D" } }
          if (Test-Path "$dir/crash.log") { Get-Content "$dir/crash.log"; $fail = $true }
          if ($p.ExitCode -ne 0) { $fail = $true }
          Get-ChildItem "$dir/*.png" | ForEach-Object { Copy-Item $_ ("test/out/ui-" + $_.Name) }
          if ($fail) { exit 1 }

      - name: Spremi rezultate testa
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-test -y --cleanup-tag 2>/dev/null || true
          if ls test/out/* >/dev/null 2>&1; then
            gh release create ci-test test/out/* --prerelease --title "CI test (ne preuzimati)" --notes "Automatski test dodavanja hrvatskih znakova." --latest=false || true
          fi

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          MSG="$(git log -1 --pretty=%s)"
          gh release create "$TAG" out/FontShelf.exe \
            --title "FontShelf build ${{ github.run_number }}" \
            --notes "$MSG" \
            --latest
